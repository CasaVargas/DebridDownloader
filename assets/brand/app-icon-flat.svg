<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2723"/>
      <stop offset="0.5" stop-color="#131c19"/>
      <stop offset="1" stop-color="#0c1311"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="512" y1="280" x2="512" y2="740">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="760" rx="330" ry="210" fill="#10b981" fill-opacity="0.30" filter="url(#soft)"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.055"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <g fill="none" stroke="url(#ink)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 292 L512 402 L652 292" stroke-opacity="0.22"/>
    <path d="M372 386 L512 496 L652 386" stroke-opacity="0.5"/>
    <path d="M372 480 L512 590 L652 480"/>
    <path d="M300 604 V670 Q300 730 360 730 H664 Q724 730 724 670 V604"/>
  </g>
</svg>
