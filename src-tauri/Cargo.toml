[package]
name = "debriddownloader"
version = "1.7.4"
description = "Real-Debrid Torrent Downloader"
authors = ["Jonathan"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "debriddownloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop app (Tauri) is the default. `--no-default-features --features headless` builds the
# Tauri-free server binary instead (no webview, no display needed).
[features]
default = ["desktop"]
desktop = [
    "dep:tauri-build",
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-store",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-notification",
    "dep:fix-path-env",
]
headless = []

[[bin]]
name = "debriddownloader"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "debriddownloader-headless"
path = "src/bin/headless.rs"
required-features = ["headless"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
regex = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
urlencoding = "2"
zip = "2"
sevenz-rust2 = "0.13"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
bzip2 = "0.4"
# Extra ZIP methods for "Download contents" (already built as dependencies of `zip`).
zstd = "0.13"
deflate64 = "0.1"
lzma-rs = "0.3"
which = "7"
async-trait = "0.1"
quick-xml = "0.37"
sha1 = "0.10"
tauri-plugin-updater = { version = "2.10.0", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", optional = true }
fs4 = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
