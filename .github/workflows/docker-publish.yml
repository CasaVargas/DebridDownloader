name: Docker image

# Publishes the headless image to ghcr.io/casavargas/debriddownloader when a v* tag is pushed
# (the same tag build.yml releases the desktop app from). Each architecture is built on its own
# runner, smoke-tested with scripts/docker-smoke.sh before anything is pushed, and pushed by
# digest; `publish` then joins the digests into one multi-arch tag.
#
# Tags: `<version>` always; `latest` too unless the version is a prerelease (has a `-`).
# Run by hand with dry_run to build and smoke-test both architectures without pushing, or with
# an existing tag to publish that version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.8.0); leave empty for a dry run"
        type: string
        default: ""
      dry_run:
        description: "Build and smoke-test without pushing"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/casavargas/debriddownloader
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUSH: ${{ github.event_name == 'push' || (inputs.dry_run != true && inputs.tag != '') }}

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Dry run or tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$TAG" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Run by hand with no tag: leave dry_run on to build without publishing."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      # Loaded locally, so the smoke test runs before anything is pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: debriddownloader:smoke
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Smoke and persistence
        run: bash scripts/docker-smoke.sh debriddownloader:smoke
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build again, from the cache, pushed by digest only (no tag yet).
      - name: Push by digest
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Export the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Keep the digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' || (inputs.dry_run != true && inputs.tag != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures into one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          version="${TAG#v}"
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          tags=(-t "$IMAGE:$version")
          case "$version" in
            *-*) echo "$version is a prerelease: latest is left alone." ;;
            *) tags+=(-t "$IMAGE:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
