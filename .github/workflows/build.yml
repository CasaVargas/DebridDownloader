name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundle:
        description: "Build signed installers for every platform as workflow artifacts (no release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || inputs.bundle
    # A normal build takes ~10 min; fail fast instead of burning the 6h default if something hangs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          # Windows
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          # Cross-compiled on x64: Azure Artifact Signing's signtool dlib ships x64/x86 builds
          # only, so signing on the windows-11-arm runner would need an emulated x64 .NET stack.
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            name: Windows-arm64
          # Linux
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux: install system dependencies for Tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # macOS: Import signing certificate from secrets
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # New keychains auto-lock after 5 min; the build takes longer, and a locked keychain makes
          # codesign wait forever for a password prompt. Keep it unlocked for the job's lifetime.
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # Windows: Azure Artifact Signing (account casavargas, profile casavargas-public-trust, the
      # same one Beltr uses). Tauri's signCommand (src-tauri/windows/tauri.signing.conf.json) runs
      # src-tauri/windows/sign.ps1 on the app exe, the NSIS installer and uninstaller, and the MSI,
      # before it zips and minisigns the updater artifacts. This step fetches the signing dlib, finds
      # signtool, and signs a throwaway exe through the same script, so a bad secret, a missing
      # signer role or a wrong endpoint fails here, readably, instead of deep inside the bundler.
      - name: Set up Azure Artifact Signing
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'  # Windows PowerShell's progress bar crawls downloads
          foreach ($name in 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              Write-Host "::error::The $name secret is not set on this repo. Windows builds are signed with Azure Artifact Signing and need AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET."
              exit 1
            }
          }
          # The dlib is .NET 8 code hosted inside signtool (rollForward: Major). Without an x64
          # .NET 8+ runtime, signtool exits 3 and prints nothing at all.
          $netcore = Join-Path $env:ProgramFiles 'dotnet\shared\Microsoft.NETCore.App'
          $runtimes = Get-ChildItem $netcore -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+' -and [int]$Matches[0] -ge 8 }
          if (-not $runtimes) {
            Write-Host "::error::No x64 .NET 8+ runtime on this runner; Azure Artifact Signing needs one."
            exit 1
          }
          # Pinned, hash-checked Artifact Signing client (the signtool dlib).
          $version = '1.0.128'
          $sha256 = '74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B'
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          $pkg = Join-Path $dir "Microsoft.ArtifactSigning.Client.$version.zip"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$version" -OutFile $pkg -UseBasicParsing
          $actual = (Get-FileHash $pkg -Algorithm SHA256).Hash
          if ($actual -ne $sha256) {
            Write-Host "::error::Microsoft.ArtifactSigning.Client $version hash mismatch: got $actual"
            exit 1
          }
          Expand-Archive $pkg (Join-Path $dir 'client') -Force
          $dlib = Join-Path $dir 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) {
            Write-Host "::error::$dlib is missing from the Artifact Signing client package"
            exit 1
          }
          # Newest Windows SDK signtool; Artifact Signing needs 10.0.22621.755 or later.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool -or [version]$signtool.Directory.Parent.Name -lt [version]'10.0.22621.0') {
            Write-Host "::error::No Windows SDK signtool 10.0.22621 or later on this runner"
            exit 1
          }
          Write-Host "signtool: $($signtool.FullName)"
          Write-Host "dlib: $dlib"
          # Add-Content, not Out-File -Encoding utf8: Windows PowerShell would write a BOM.
          Add-Content $env:GITHUB_ENV "SIGNTOOL_PATH=$($signtool.FullName)"
          Add-Content $env:GITHUB_ENV "ARTIFACT_SIGNING_DLIB=$dlib"
          $env:SIGNTOOL_PATH = $signtool.FullName
          $env:ARTIFACT_SIGNING_DLIB = $dlib
          # A throwaway exe of our own, so the probe never signs anything that ships.
          $probe = Join-Path $env:RUNNER_TEMP 'signing-probe.exe'
          Add-Type -TypeDefinition 'public static class Probe { public static void Main() {} }' -OutputAssembly $probe -OutputType ConsoleApplication
          # signtool writes errors to stderr; under 'Stop' Windows PowerShell would abort on the
          # first line instead of reaching the explanation below.
          $ErrorActionPreference = 'Continue'
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File src-tauri\windows\sign.ps1 $probe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Azure Artifact Signing failed (signtool exit $LASTEXITCODE, output above). A 403 means the Entra app lacks the Artifact Signing Certificate Profile Signer role on the casavargas account."
            exit 1
          }
          $sig = Get-AuthenticodeSignature $probe
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Signing probe came back '$($sig.Status)': $($sig.StatusMessage)"
            exit 1
          }
          # Artifact Signing certificates live for days; without a timestamp every signature
          # would stop validating soon after release.
          if (-not $sig.TimeStamperCertificate) {
            Write-Host "::error::Signing probe has no timestamp"
            exit 1
          }
          Write-Host "Signing works. Signer: $($sig.SignerCertificate.Subject)"

      # Build only — no release upload (tauri-action race conditions corrupt assets)
      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS signing + notarization
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Windows signing (src-tauri/windows/sign.ps1)
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        with:
          args: --target ${{ matrix.target }}${{ runner.os == 'Windows' && ' --config src-tauri/windows/tauri.signing.conf.json' || '' }}

      # Every exe and msi a user can run must carry a valid, timestamped Artifact Signing
      # signature. (The uninstaller lives inside the installer; the bundler signs it the same way.)
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $release = "src-tauri\target\$env:TARGET\release"
          $files = @(Get-Item "$release\debriddownloader.exe") +
            @(Get-ChildItem "$release\bundle" -Recurse -Include *.exe, *.msi)
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($f.Name) is not validly signed and timestamped: $($sig.Status) $($sig.StatusMessage)"
              $bad++
            } else {
              Write-Host "$($f.Name): $($sig.SignerCertificate.Subject)"
            }
          }
          if ($bad) { exit 1 }

      # Upload all build artifacts for the publish job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # Single job creates release and uploads everything — no race conditions
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"

          # Create draft release
          RELEASE_ID=$(gh api "repos/${REPO}/releases" \
            -f tag_name="${TAG}" \
            -f name="DebridDownloader ${TAG}" \
            -f body="## Downloads

          | Platform | Architecture | File |
          |----------|-------------|------|
          | macOS | Apple Silicon (M1/M2/M3) | \`.dmg\` (aarch64) |
          | Windows | x64 | \`.exe\` installer |
          | Windows | ARM64 | \`.exe\` installer |
          | Linux | x64 | \`.deb\` / \`.rpm\` / \`.AppImage\` |
          | Linux | ARM64 | \`.deb\` / \`.rpm\` / \`.AppImage\` |" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')

          echo "Created draft release ${RELEASE_ID}"

          # Rename the macOS .app.tar.gz to include the arch suffix
          # the updater expects (tauri-action outputs DebridDownloader.app.tar.gz
          # with no arch tag).
          for f in artifacts/artifacts-macOS-arm64/macos/DebridDownloader.app.tar.gz artifacts/artifacts-macOS-arm64/macos/DebridDownloader.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            NEWNAME=$(echo "$(basename "$f")" | sed "s/DebridDownloader/DebridDownloader_aarch64/")
            mv "$f" "$(dirname "$f")/${NEWNAME}"
            echo "Renamed $(basename "$f") -> ${NEWNAME}"
          done

          # Collect all files to upload (skip .app bundles and icons)
          UPLOAD_FILES=()
          while IFS= read -r f; do
            [[ "$f" == *.app/* ]] && continue
            [[ "$f" == *"/icons/"* ]] && continue
            UPLOAD_FILES+=("$f")
          done < <(find artifacts -type f \
            \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" -o -name "*.AppImage.tar.gz" -o -name "*.AppImage.tar.gz.sig" \
               -o -name "*.AppImage.sig" \
               -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
               -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \
               -o -name "*.msi.zip" -o -name "*.msi.zip.sig" \
               -o -name "*.deb.sig" -o -name "*.rpm.sig" \
               -o -name "*.dmg.sig" -o -name "*.exe.sig" -o -name "*.msi.sig" \) \
            | sort)

          echo "=== Files to upload (${#UPLOAD_FILES[@]}) ==="
          printf '%s\n' "${UPLOAD_FILES[@]}"

          # Upload each file
          for f in "${UPLOAD_FILES[@]}"; do
            BASENAME=$(basename "$f")
            echo "Uploading ${BASENAME}..."
            gh release upload "${TAG}" "$f" --repo "${REPO}" --clobber
          done

          echo "=== All assets uploaded ==="

          # Now generate latest.json from uploaded assets
          ASSETS=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100")

          # Construct download URL from tag + filename (not browser_download_url which has untagged-xxx for drafts)
          asset_url() {
            local filename
            filename=$(echo "$ASSETS" | jq -r --arg suffix "$1" \
              '[.[] | select(.name | endswith($suffix)) | .name][0] // ""')
            if [ -n "$filename" ]; then
              echo "https://github.com/${REPO}/releases/download/${TAG}/${filename}"
            else
              echo ""
            fi
          }

          sig_content() {
            local asset_id
            asset_id=$(echo "$ASSETS" | jq -r --arg suffix "$1" \
              '[.[] | select(.name | endswith($suffix)) | .id][0] // empty')
            if [ -n "$asset_id" ]; then
              gh api -H "Accept: application/octet-stream" \
                "repos/${REPO}/releases/assets/${asset_id}" 2>/dev/null || echo ""
            else
              echo ""
            fi
          }

          # macOS
          DARWIN_AARCH64_URL=$(asset_url "_aarch64.app.tar.gz")
          DARWIN_AARCH64_SIG=$(sig_content "_aarch64.app.tar.gz.sig")

          # Windows
          WINDOWS_X64_URL=$(asset_url "_x64-setup.nsis.zip")
          WINDOWS_X64_SIG=$(sig_content "_x64-setup.nsis.zip.sig")
          WINDOWS_AARCH64_URL=$(asset_url "_arm64-setup.nsis.zip")
          WINDOWS_AARCH64_SIG=$(sig_content "_arm64-setup.nsis.zip.sig")

          # Linux
          LINUX_X64_URL=$(asset_url "_amd64.AppImage.tar.gz")
          LINUX_X64_SIG=$(sig_content "_amd64.AppImage.tar.gz.sig")
          LINUX_AARCH64_URL=$(asset_url "_aarch64.AppImage.tar.gz")
          LINUX_AARCH64_SIG=$(sig_content "_aarch64.AppImage.tar.gz.sig")

          echo "=== Platform URLs ==="
          echo "darwin-aarch64: ${DARWIN_AARCH64_URL:-MISSING}"
          echo "windows-x86_64: ${WINDOWS_X64_URL:-MISSING}"
          echo "windows-aarch64: ${WINDOWS_AARCH64_URL:-MISSING}"
          echo "linux-x86_64:  ${LINUX_X64_URL:-MISSING}"
          echo "linux-aarch64: ${LINUX_AARCH64_URL:-MISSING}"

          LATEST_JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg darwin_aarch64_url "$DARWIN_AARCH64_URL" \
            --arg darwin_aarch64_sig "$DARWIN_AARCH64_SIG" \
            --arg windows_x64_url "$WINDOWS_X64_URL" \
            --arg windows_x64_sig "$WINDOWS_X64_SIG" \
            --arg windows_aarch64_url "$WINDOWS_AARCH64_URL" \
            --arg windows_aarch64_sig "$WINDOWS_AARCH64_SIG" \
            --arg linux_x64_url "$LINUX_X64_URL" \
            --arg linux_x64_sig "$LINUX_X64_SIG" \
            --arg linux_aarch64_url "$LINUX_AARCH64_URL" \
            --arg linux_aarch64_sig "$LINUX_AARCH64_SIG" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: (
                {}
                | if $darwin_aarch64_url != "" then . + {"darwin-aarch64": {signature: $darwin_aarch64_sig, url: $darwin_aarch64_url}} else . end
                | if $windows_x64_url != "" then . + {"windows-x86_64": {signature: $windows_x64_sig, url: $windows_x64_url}} else . end
                | if $windows_aarch64_url != "" then . + {"windows-aarch64": {signature: $windows_aarch64_sig, url: $windows_aarch64_url}} else . end
                | if $linux_x64_url != "" then . + {"linux-x86_64": {signature: $linux_x64_sig, url: $linux_x64_url}} else . end
                | if $linux_aarch64_url != "" then . + {"linux-aarch64": {signature: $linux_aarch64_sig, url: $linux_aarch64_url}} else . end
              )
            }')

          echo "$LATEST_JSON" > latest.json
          echo "=== latest.json ==="
          cat latest.json
          gh release upload "${TAG}" latest.json --repo "${REPO}" --clobber
          # Publish the release (so /releases/latest/download/latest.json works)
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false
          echo "Published release ${TAG}"

  # Separate job for build checks (workflow_dispatch, no release)
  build-check:
    if: github.event_name == 'workflow_dispatch' && !inputs.bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # build-check only verifies compile — skip bundling so we don't
      # need the Apple signing cert (which is only imported in the release
      # `build` job above).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --no-bundle --target ${{ matrix.target }}
